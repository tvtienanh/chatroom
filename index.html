<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f0f13;
            --surface: #17171e;
            --surface2: #1e1e28;
            --border: rgba(255,255,255,0.07);
            --accent: #7c6af7;
            --sent-bg: linear-gradient(135deg, #7c6af7, #5b4dd1);
            --recv-bg: #1e1e28;
            --text: #e8e8f0;
            --text-muted: #6b6b80;
            --online: #22c55e;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg); height:100vh; overflow:hidden; color:var(--text); }

        /* LOGIN */
        .login-overlay { position:fixed; inset:0; background:rgba(0,0,0,.8); backdrop-filter:blur(20px); display:flex; align-items:center; justify-content:center; z-index:3000; }
        .login-card { background:var(--surface); border:1px solid var(--border); border-radius:28px; padding:48px 44px; width:min(420px,92vw); animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
        @keyframes popIn { from{transform:scale(.85) translateY(20px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
        .login-icon { width:64px;height:64px;background:linear-gradient(135deg,var(--accent),#5eead4);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 24px;box-shadow:0 8px 32px rgba(124,106,247,.35); }
        .login-card h2 { text-align:center;font-size:26px;font-weight:700;margin-bottom:6px; }
        .login-card p { text-align:center;color:var(--text-muted);font-size:14px;margin-bottom:32px; }
        .login-input { width:100%;padding:14px 18px;background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s;margin-bottom:14px; }
        .login-input:focus { border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,106,247,.15); }
        .login-btn { width:100%;padding:15px;background:linear-gradient(135deg,var(--accent),#5b4dd1);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:transform .2s,box-shadow .2s,opacity .2s;box-shadow:0 6px 24px rgba(124,106,247,.35); }
        .login-btn:hover:not(:disabled) { transform:translateY(-2px);box-shadow:0 10px 32px rgba(124,106,247,.45); }
        .login-btn:disabled { opacity:.55;cursor:not-allowed; }

        /* LAYOUT */
        .app { height:100vh;display:flex;flex-direction:column; }

        /* HEADER */
        .header { display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;gap:12px; }
        .header-left { display:flex;align-items:center;gap:14px; }
        .header-logo { width:40px;height:40px;background:linear-gradient(135deg,var(--accent),#5eead4);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0; }
        .header-title { font-size:17px;font-weight:700; }
        .header-sub { font-size:12px;color:var(--text-muted);margin-top:2px; }
        .header-right { display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end; }
        .pill { display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);padding:7px 13px;border-radius:100px;font-size:13px;font-weight:500;white-space:nowrap; }
        .pill-dot { width:8px;height:8px;background:var(--online);border-radius:50%;box-shadow:0 0 6px var(--online);animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .avatar-sm { width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#5eead4);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0; }
        .logout-btn { background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.2);color:#f87171;padding:7px 14px;border-radius:100px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .2s,transform .2s; }
        .logout-btn:hover { background:rgba(239,68,68,.22);transform:translateY(-1px); }

        /* MESSAGES */
        .messages { flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:6px; }
        .messages::-webkit-scrollbar { width:5px; }
        .messages::-webkit-scrollbar-thumb { background:var(--surface2);border-radius:99px; }
        .msg-row { display:flex;align-items:flex-end;gap:9px;max-width:72%;animation:msgIn .3s cubic-bezier(.34,1.56,.64,1); }
        @keyframes msgIn { from{transform:translateY(14px) scale(.95);opacity:0} to{transform:translateY(0) scale(1);opacity:1} }
        .msg-row.sent { align-self:flex-end;flex-direction:row-reverse; }
        .msg-row.recv { align-self:flex-start; }
        .msg-av { width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0; }
        .msg-row.sent .msg-av { background:linear-gradient(135deg,var(--accent),#5b4dd1); }
        .msg-row.recv .msg-av { background:linear-gradient(135deg,#f97316,#fbbf24); }
        .msg-body { display:flex;flex-direction:column;gap:3px; }
        .msg-row.sent .msg-body { align-items:flex-end; }
        .msg-name { font-size:11px;color:var(--text-muted);padding:0 4px; }
        .msg-bubble { padding:11px 16px;border-radius:18px;font-size:14.5px;line-height:1.45;word-break:break-word;max-width:100%; }
        .msg-row.sent .msg-bubble { background:var(--sent-bg);color:#fff;border-bottom-right-radius:5px;box-shadow:0 4px 20px rgba(124,106,247,.25); }
        .msg-row.recv .msg-bubble { background:var(--recv-bg);color:var(--text);border-bottom-left-radius:5px;border:1px solid var(--border); }
        .msg-bubble.sticker-bubble { background:transparent!important;border:none!important;padding:4px;box-shadow:none!important; }
        .sticker-img { width:120px;height:120px;object-fit:contain;border-radius:12px; }
        .msg-bubble img.chat-img { max-width:260px;max-height:260px;border-radius:12px;cursor:pointer;display:block; }
        .msg-time { font-size:10.5px;color:var(--text-muted);padding:0 4px; }
        .sys-msg { align-self:center;font-size:12.5px;color:var(--text-muted);background:var(--surface2);border:1px solid var(--border);padding:6px 14px;border-radius:100px; }

        /* INPUT */
        .input-area { flex-shrink:0;padding:14px 20px;background:var(--surface);border-top:1px solid var(--border);position:relative; }
        .input-row { display:flex;align-items:flex-end;gap:10px;background:var(--surface2);border:1.5px solid var(--border);border-radius:22px;padding:8px 8px 8px 14px;transition:border-color .2s,box-shadow .2s; }
        .input-row:focus-within { border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,106,247,.12); }
        .icon-btn { width:36px;height:36px;border-radius:50%;border:none;background:transparent;color:var(--text-muted);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s;flex-shrink:0; }
        .icon-btn:hover { color:var(--accent);background:rgba(124,106,247,.12); }
        .msg-input { flex:1;background:transparent;border:none;color:var(--text);font-size:14.5px;font-family:inherit;outline:none;resize:none;max-height:110px;min-height:22px;line-height:1.4;padding:6px 0; }
        .msg-input::placeholder { color:var(--text-muted); }
        .msg-input:disabled { cursor:not-allowed;opacity:.4; }
        .send-btn { width:38px;height:38px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--accent),#5b4dd1);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .2s,box-shadow .2s,opacity .2s;box-shadow:0 4px 16px rgba(124,106,247,.3); }
        .send-btn:hover:not(:disabled) { transform:scale(1.1);box-shadow:0 6px 22px rgba(124,106,247,.45); }
        .send-btn:disabled { opacity:.4;cursor:not-allowed; }
        #fileInput { display:none; }

        /* PICKER */
        .picker { position:absolute;bottom:calc(100% + 10px);left:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 12px 48px rgba(0,0,0,.5);display:none;overflow:hidden;z-index:500;max-height:320px; }
        .picker.show { display:flex;flex-direction:column;animation:popIn .25s ease; }
        .picker-tabs { display:flex;gap:6px;padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--border); }
        .ptab { padding:7px 16px;border:none;background:transparent;color:var(--text-muted);border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s; }
        .ptab.active { background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(124,106,247,.35); }
        .picker-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px;padding:14px;overflow-y:auto;flex:1; }
        .pick-item { aspect-ratio:1;border:none;background:transparent;border-radius:10px;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s; }
        .pick-item:hover { background:var(--surface2);transform:scale(1.2); }
        .pick-item img { width:42px;height:42px;object-fit:contain;border-radius:6px; }

        /* IMAGE MODAL */
        .img-modal { display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(16px);z-index:5000;align-items:center;justify-content:center; }
        .img-modal.show { display:flex; }
        .img-modal img { max-width:90vw;max-height:90vh;object-fit:contain;border-radius:14px;cursor:zoom-in;transition:transform .3s; }
        .img-modal img.zoomed { transform:scale(1.6);cursor:zoom-out; }
        .img-modal-close { position:absolute;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer;background:rgba(255,255,255,.1);border:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .2s; }
        .img-modal-close:hover { background:rgba(255,255,255,.2); }

        /* IMAGE PREVIEW */
        .img-preview-wrap { position:absolute;bottom:calc(100% + 8px);left:20px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;display:none;box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:400; }
        .img-preview-wrap.show { display:block; }
        .img-preview-wrap img { max-width:200px;max-height:160px;object-fit:contain;border-radius:8px;display:block; }
        .preview-rm { position:absolute;top:-8px;right:-8px;width:22px;height:22px;background:#ef4444;color:#fff;border:none;border-radius:50%;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center; }

        /* TOAST */
        .toast { position:fixed;top:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:14px;padding:14px 18px;max-width:320px;z-index:4000;transform:translateX(120%);transition:transform .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 32px rgba(0,0,0,.4); }
        .toast.show { transform:translateX(0); }
        .toast-head { display:flex;align-items:center;gap:10px;margin-bottom:5px; }
        .toast-av { width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#f97316,#fbbf24);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff; }
        .toast-name { font-size:13px;font-weight:700; }
        .toast-text { font-size:12.5px;color:var(--text-muted);padding-left:42px; }
        .toast-close { position:absolute;top:10px;right:10px;background:none;border:none;color:var(--text-muted);font-size:15px;cursor:pointer;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center; }

        @media(max-width:600px) {
            .header { padding:12px 16px; }
            .messages { padding:14px 16px; }
            .input-area { padding:12px 14px; }
            .logout-btn span { display:none; }
            .msg-row { max-width:86%; }
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-card">
        <div class="login-icon">💬</div>
        <h2>Phòng Chat</h2>
        <p>Nhập tên để bắt đầu trò chuyện</p>
        <input class="login-input" type="text" id="usernameInput" placeholder="Tên của bạn..." maxlength="25">
        <button class="login-btn" id="loginBtn" onclick="login()">
            <i class="fas fa-sign-in-alt"></i> Vào chat
        </button>
    </div>
</div>

<!-- APP -->
<div class="app">
    <div class="header">
        <div class="header-left">
            <div class="header-logo">💬</div>
            <div>
                <div class="header-title">Phòng Chat</div>
                <div class="header-sub">Trò chuyện thời gian thực</div>
            </div>
        </div>
        <div class="header-right">
            <div class="pill" id="currentUserPill" style="display:none">
                <div class="avatar-sm" id="headerAvatar"></div>
                <span id="headerName"></span>
            </div>
            <div class="pill">
                <div class="pill-dot"></div>
                <span id="onlineCount">0 online</span>
            </div>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> <span>Thoát</span>
            </button>
        </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <div class="img-preview-wrap" id="imgPreviewWrap">
            <img id="previewImg" src="" alt="">
            <button class="preview-rm" onclick="removePreview()">×</button>
        </div>
        <div class="picker" id="picker">
            <div class="picker-tabs">
                <button class="ptab active" onclick="switchTab('emoji',this)">😀 Emoji</button>
                <button class="ptab" onclick="switchTab('sticker',this)">🎭 Sticker</button>
            </div>
            <div class="picker-grid" id="pickerGrid"></div>
        </div>
        <div class="input-row">
            <button class="icon-btn" onclick="togglePicker()"><i class="fas fa-smile"></i></button>
            <button class="icon-btn" onclick="document.getElementById('fileInput').click()"><i class="fas fa-image"></i></button>
            <input type="file" id="fileInput" accept="image/*" onchange="onFileSelected(event)">
            <textarea class="msg-input" id="msgInput" placeholder="Nhập tin nhắn..." rows="1" disabled></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<!-- IMAGE MODAL -->
<div class="img-modal" id="imgModal" onclick="onModalClick(event)">
    <button class="img-modal-close" onclick="closeImgModal()">×</button>
    <img id="modalImg" src="" alt="">
</div>

<!-- TOAST -->
<div class="toast" id="toast">
    <button class="toast-close" onclick="closeToast()">×</button>
    <div class="toast-head">
        <div class="toast-av" id="toastAv"></div>
        <div class="toast-name" id="toastName"></div>
    </div>
    <div class="toast-text" id="toastText"></div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const PUB_KEY   = 'pub-c-1deb5f4c-7ec2-4f11-a358-9c26d21038c8';
const SUB_KEY   = 'sub-c-e8fb8105-f0a4-4838-bb00-ff1f060d9a72';
const CHANNEL   = 'chat-channel';
const IMGBB_KEY = 'ed1cc5dc6d3eb8bf728058e9d3f15109';

const EMOJIS = [
    '😀','😂','🥰','😊','😎','😍','🤔','😴','😢','😡','🤯','🥳',
    '😇','🤪','🤗','🤭','🤫','😋','😛','😝','😜','🤤','😵','🥵',
    '👍','👎','👋','🙏','🎉','❤️','💕','💯','🔥','✨','⭐','🌟',
    '💫','💥','💢','💦','🎵','🎶','👀','💪','🤝','🤑','😈','👻'
];

const STICKERS = [
    'https://zalo-api.zadn.vn/api/emoticon/sticker/webpc?eid=50347&size=130',
    'https://zalo-api.zadn.vn/api/emoticon/sticker/webpc?eid=50349&size=130',
    'https://zalo-api.zadn.vn/api/emoticon/sticker/webpc?eid=50351&size=130',
    'https://zalo-api.zadn.vn/api/emoticon/sticker/webpc?eid=50353&size=130',
    'https://zalo-api.zadn.vn/api/emoticon/sticker/webpc?eid=50355&size=130',
    'https://zalo-api.zadn.vn/api/emoticon/sticker/webpc?eid=50357&size=130',
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let username   = '';
let uuid       = '';
let previewB64 = null;
let toastTimer = null;
let subTT      = '0';
let subCtrl    = null;
let subActive  = false;

// ─── PUBNUB REST ─────────────────────────────────────────────────────────────
async function pnPublish(msg) {
    const encoded = encodeURIComponent(JSON.stringify(msg));
    const url = `https://ps.pndsn.com/publish/${PUB_KEY}/${SUB_KEY}/0/${CHANNEL}/0/${encoded}?uuid=${encodeURIComponent(uuid)}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('Publish failed: ' + r.status);
}

async function pnGetTime() {
    const r = await fetch('https://ps.pndsn.com/time/0');
    const d = await r.json();
    return d[0];
}

async function pnHereNow() {
    try {
        const url = `https://ps.pndsn.com/v2/presence/sub-key/${SUB_KEY}/channel/${CHANNEL}?uuid=${encodeURIComponent(uuid)}`;
        const r = await fetch(url);
        const d = await r.json();
        setOnline(d.occupancy || 0);
    } catch {}
}

async function pnHeartbeat() {
    try {
        await fetch(`https://ps.pndsn.com/v2/presence/sub-key/${SUB_KEY}/channel/${CHANNEL}/heartbeat?uuid=${encodeURIComponent(uuid)}&heartbeat=60`);
    } catch {}
}

// Long-poll subscribe loop
async function pnSubscribeLoop() {
    subActive = true;
    try {
        subTT = await pnGetTime();
    } catch { subTT = '0'; }

    while (subActive) {
        subCtrl = new AbortController();
        // PubNub long-poll times out at ~300s; we set 310s client timeout
        const timer = setTimeout(() => subCtrl.abort(), 310000);
        try {
            const url = `https://ps.pndsn.com/v2/subscribe/${SUB_KEY}/${CHANNEL}/0?tt=${subTT}&uuid=${encodeURIComponent(uuid)}&heartbeat=60`;
            const r = await fetch(url, { signal: subCtrl.signal });
            clearTimeout(timer);
            if (!r.ok) { await sleep(3000); continue; }
            const data = await r.json();
            subTT = data.t.t;
            for (const env of (data.m || [])) {
                handleMessage(env.d);
            }
        } catch (e) {
            clearTimeout(timer);
            if (!subActive) break;
            // AbortError = normal timeout, just re-subscribe
            if (e.name !== 'AbortError') await sleep(3000);
        }
    }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ─── MESSAGE HANDLER ─────────────────────────────────────────────────────────
function handleMessage(m) {
    if (!m || !m.type) return;
    if (m.type === 'system') {
        addSys(m.text);
    } else if (m.type === 'message' || m.type === 'sticker') {
        const isSent = m.username === username;
        addMessage(m, isSent);
        if (!isSent) showToast(m);
    }
}

// ─── AUTH ─────────────────────────────────────────────────────────────────────
async function login() {
    const val = document.getElementById('usernameInput').value.trim();
    if (!val || val.length < 2) return;

    username = val;
    uuid = username + '_' + Math.random().toString(36).slice(2, 7);

    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('msgInput').disabled  = false;
    document.getElementById('sendBtn').disabled   = false;
    document.getElementById('headerAvatar').textContent = username[0].toUpperCase();
    document.getElementById('headerName').textContent   = username;
    document.getElementById('currentUserPill').style.display = 'flex';

    renderPicker('emoji');
    pnSubscribeLoop();

    setTimeout(pnHereNow, 800);
    setInterval(pnHeartbeat, 50000);
    setInterval(pnHereNow, 30000);

    setTimeout(() => {
        pnPublish({ type:'system', text:`${username} đã tham gia phòng chat`, timestamp: new Date().toISOString() }).catch(() => {});
    }, 900);
}

async function logout() {
    if (!username) return;
    subActive = false;
    if (subCtrl) subCtrl.abort();

    try {
        await pnPublish({ type:'system', text:`${username} đã rời khỏi phòng chat`, timestamp: new Date().toISOString() });
    } catch {}

    username = '';
    document.getElementById('messages').innerHTML = '';
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('msgInput').disabled  = true;
    document.getElementById('sendBtn').disabled   = true;
    document.getElementById('currentUserPill').style.display = 'none';
    document.getElementById('usernameInput').value = '';
    setOnline(0);
    removePreview();
    hidePicker();
}

// ─── SEND ─────────────────────────────────────────────────────────────────────
async function sendMessage() {
    const inp  = document.getElementById('msgInput');
    const text = inp.value.trim();
    if (!text && !previewB64) return;

    if (previewB64) {
        try {
            const blob = b64toBlob(previewB64);
            const url  = await uploadImgBB(blob);
            await pnPublish({ type:'message', username, image:url, text:'', timestamp: new Date().toISOString() });
        } catch { addSys('Không thể gửi ảnh, vui lòng thử lại'); }
        removePreview();
    }

    if (text) {
        inp.value = '';
        autoResize(inp);
        try {
            await pnPublish({ type:'message', username, text, timestamp: new Date().toISOString() });
        } catch { addSys('Không thể gửi tin nhắn, vui lòng thử lại'); }
    }
}

async function sendSticker(url) {
    hidePicker();
    try {
        await pnPublish({ type:'sticker', username, stickerUrl:url, timestamp: new Date().toISOString() });
    } catch { addSys('Không thể gửi sticker'); }
}

// ─── DISPLAY ──────────────────────────────────────────────────────────────────
function addMessage(m, isSent) {
    const wrap = document.getElementById('messages');
    const row  = document.createElement('div');
    row.className = `msg-row ${isSent ? 'sent' : 'recv'}`;

    const time = new Date(m.timestamp).toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit' });
    let bubbleHTML = '';

    if (m.type === 'sticker') {
        bubbleHTML = `<div class="msg-bubble sticker-bubble"><img src="${escHtml(m.stickerUrl)}" class="sticker-img" alt="sticker"></div>`;
    } else if (m.image) {
        bubbleHTML = `<div class="msg-bubble"><img src="${escHtml(m.image)}" class="chat-img" onclick="openImgModal(this.src)" alt="image"></div>`;
    } else {
        bubbleHTML = `<div class="msg-bubble">${escHtml(m.text)}</div>`;
    }

    row.innerHTML = `
        <div class="msg-av">${escHtml(m.username[0].toUpperCase())}</div>
        <div class="msg-body">
            ${!isSent ? `<div class="msg-name">${escHtml(m.username)}</div>` : ''}
            ${bubbleHTML}
            <div class="msg-time">${time}</div>
        </div>`;

    wrap.appendChild(row);
    wrap.scrollTop = wrap.scrollHeight;
}

function addSys(text) {
    const wrap = document.getElementById('messages');
    const el   = document.createElement('div');
    el.className   = 'sys-msg';
    el.textContent = text;
    wrap.appendChild(el);
    wrap.scrollTop = wrap.scrollHeight;
}

function setOnline(n) {
    document.getElementById('onlineCount').textContent = `${n} online`;
}

// ─── PICKER ───────────────────────────────────────────────────────────────────
function switchTab(tab, el) {
    document.querySelectorAll('.ptab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderPicker(tab);
}

function renderPicker(tab) {
    const grid = document.getElementById('pickerGrid');
    grid.innerHTML = '';
    if (tab === 'emoji') {
        EMOJIS.forEach(e => {
            const btn = document.createElement('button');
            btn.className   = 'pick-item';
            btn.textContent = e;
            btn.onclick = () => {
                document.getElementById('msgInput').value += e;
                document.getElementById('msgInput').focus();
            };
            grid.appendChild(btn);
        });
    } else {
        STICKERS.forEach(url => {
            const btn = document.createElement('button');
            btn.className = 'pick-item';
            btn.innerHTML = `<img src="${url}" alt="sticker" onerror="this.parentElement.style.display='none'">`;
            btn.onclick = () => sendSticker(url);
            grid.appendChild(btn);
        });
    }
}

function togglePicker() { document.getElementById('picker').classList.toggle('show'); }
function hidePicker()   { document.getElementById('picker').classList.remove('show'); }

// ─── IMAGE ────────────────────────────────────────────────────────────────────
function onFileSelected(e) {
    const file = e.target.files[0];
    if (file && file.type.startsWith('image/')) processImg(file);
    e.target.value = '';
}

async function processImg(file) {
    try {
        const blob = await compressImg(file);
        const b64  = await blobToB64(blob);
        showPreview(b64);
    } catch { addSys('Không thể xử lý ảnh'); }
}

function compressImg(file) {
    return new Promise((res, rej) => {
        const MAX = 1920;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = ev => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
                let { width: w, height: h } = img;
                if (w > MAX || h > MAX) {
                    if (w > h) { h = h * MAX / w; w = MAX; }
                    else       { w = w * MAX / h; h = MAX; }
                }
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                c.getContext('2d').drawImage(img, 0, 0, w, h);
                c.toBlob(blob => res(blob), file.type, 0.9);
            };
            img.onerror = rej;
        };
        reader.onerror = rej;
    });
}

function blobToB64(blob) {
    return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload  = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(blob);
    });
}

function b64toBlob(dataURL) {
    const [head, data] = dataURL.split(',');
    const mime = head.match(/:(.*?);/)[1];
    const bstr = atob(data);
    const arr  = new Uint8Array(bstr.length);
    for (let i = 0; i < bstr.length; i++) arr[i] = bstr.charCodeAt(i);
    return new Blob([arr], { type: mime });
}

async function uploadImgBB(blob) {
    const fd = new FormData();
    fd.append('image', blob);
    const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method:'POST', body:fd });
    const d = await r.json();
    if (!d.success) throw new Error('Upload failed');
    return d.data.url;
}

function showPreview(b64) {
    previewB64 = b64;
    document.getElementById('previewImg').src = b64;
    document.getElementById('imgPreviewWrap').classList.add('show');
}

function removePreview() {
    previewB64 = null;
    document.getElementById('previewImg').src = '';
    document.getElementById('imgPreviewWrap').classList.remove('show');
}

function openImgModal(src) {
    document.getElementById('modalImg').src = src;
    document.getElementById('imgModal').classList.add('show');
}

function onModalClick(e) {
    if (e.target === document.getElementById('modalImg')) {
        document.getElementById('modalImg').classList.toggle('zoomed');
    } else {
        closeImgModal();
    }
}

function closeImgModal() {
    document.getElementById('imgModal').classList.remove('show');
    document.getElementById('modalImg').classList.remove('zoomed');
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function showToast(m) {
    clearTimeout(toastTimer);
    document.getElementById('toastAv').textContent   = m.username[0].toUpperCase();
    document.getElementById('toastName').textContent = m.username;
    const body = m.type === 'sticker' ? '🎭 Đã gửi sticker'
               : m.image              ? '🖼️ Đã gửi ảnh'
               : m.text.length > 55   ? m.text.slice(0,55)+'…' : m.text;
    document.getElementById('toastText').textContent = body;
    document.getElementById('toast').classList.add('show');
    toastTimer = setTimeout(closeToast, 5000);
}

function closeToast() { document.getElementById('toast').classList.remove('show'); }

// ─── UTILS ────────────────────────────────────────────────────────────────────
function escHtml(s) {
    return String(s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
}

// ─── EVENTS ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    const inp = document.getElementById('msgInput');
    inp.addEventListener('input', () => autoResize(inp));
    inp.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    inp.addEventListener('paste', async e => {
        for (const item of (e.clipboardData || e.originalEvent.clipboardData).items) {
            if (item.type.startsWith('image/')) {
                e.preventDefault();
                await processImg(item.getAsFile());
            }
        }
    });

    document.getElementById('usernameInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeImgModal();
    });

    document.addEventListener('click', e => {
        const picker = document.getElementById('picker');
        if (!picker.contains(e.target) && !e.target.closest('.icon-btn')) hidePicker();
    });
});

window.addEventListener('beforeunload', () => {
    subActive = false;
    if (subCtrl) subCtrl.abort();
    if (username) {
        const msg     = JSON.stringify({ type:'system', text:`${username} đã rời khỏi phòng chat`, timestamp: new Date().toISOString() });
        const encoded = encodeURIComponent(msg);
        navigator.sendBeacon(`https://ps.pndsn.com/publish/${PUB_KEY}/${SUB_KEY}/0/${CHANNEL}/0/${encoded}?uuid=${encodeURIComponent(uuid)}`);
    }
});
</script>
